name: Reproducible Build (Windows)

# The second host of the dual-hosted lane: rebuild adlibgold.sys natively on Windows
# from the same pinned DDK+VC6 deps-bundle and prove it reproduces the SAME recorded
# artifact hash as the Linux/Wine build, byte-for-byte (call/0007, call/0009). Because
# both hosts run the identical VC6 binaries over identical C:\ paths, the artifacts must
# match; this job is what proves it. The bundle lives in the private slartibardfast/ddk
# repo (its licence forbids public redistribution); CI checks it out with the read-only
# deploy key (secret DDK_DEPLOY_KEY).

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['*.cpp', '*.h', 'sources', 'build.bat', 'build.sh', 'pe_normalize.py', 'deps-bundle.lock']

env:
  BUNDLE_SHA: f60af3fd65b53b67176499d9959adc1235cb1a1d3024c0adb6b7bd3c2fadb902
  ARTIFACT_SHA: 410dc88ca159e8c9b4e8db68f14177ac127aa9ae1e7cbb3b9dfd1bb10fe5f847

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check out the pinned deps-bundle from private storage (read-only deploy key)
        uses: actions/checkout@v5
        with:
          repository: slartibardfast/ddk
          ssh-key: ${{ secrets.DDK_DEPLOY_KEY }}
          path: ddk
      - name: Verify the bundle sha (provenance gate)
        shell: bash
        run: echo "$BUNDLE_SHA  ddk/adlibgold-ddk-vc6-bundle.tar.gz" | sha256sum -c -
      - name: Build natively with the VC6 toolchain
        shell: cmd
        run: |
          set BUNDLE=%CD%\ddk\adlibgold-ddk-vc6-bundle.tar.gz
          call build.bat
      - name: Prove the Windows artifact is byte-identical to the Linux/Wine build
        shell: bash
        run: echo "$ARTIFACT_SHA  adlibgold.sys" | sha256sum -c -
