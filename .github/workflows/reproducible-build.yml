name: Reproducible Build

# Rebuild adlibgold.sys under Linux/Wine from the pinned, Microsoft-licensed DDK+VC6
# deps-bundle and prove it reproduces the recorded artifact hash byte-for-byte
# (call/0007, call/0008, call/0009). The bundle lives in the private slartibardfast/ddk
# repo (its licence forbids public redistribution); CI checks it out with a read-only
# deploy key (secret DDK_DEPLOY_KEY). The sha check is the provenance gate; the build
# itself uses no network.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['*.cpp', '*.h', 'sources', 'build.sh', 'pe_normalize.py', 'deps-bundle.lock']

env:
  BUNDLE_SHA: f60af3fd65b53b67176499d9959adc1235cb1a1d3024c0adb6b7bd3c2fadb902
  ARTIFACT_SHA: 888f082a46eb41ff497e677b4aae3955d7ead16a131986c9c96ddf6c74ef8819

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check out the pinned deps-bundle from private storage (read-only deploy key)
        uses: actions/checkout@v5
        with:
          repository: slartibardfast/ddk
          ssh-key: ${{ secrets.DDK_DEPLOY_KEY }}
          path: ddk
      - name: Verify the bundle sha (provenance gate)
        run: echo "$BUNDLE_SHA  ddk/adlibgold-ddk-vc6-bundle.tar.gz" | sha256sum -c -
      - name: Install Wine
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends wine wine32 python3
      - name: Build offline and prove the artifact reproduces
        run: |
          BUNDLE="$PWD/ddk/adlibgold-ddk-vc6-bundle.tar.gz" ./build.sh
          echo "$ARTIFACT_SHA  adlibgold.sys" | sha256sum -c -
