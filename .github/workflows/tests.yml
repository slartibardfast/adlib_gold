name: Tests

# Userspace unit tests for the driver's pure logic (no DDK/hardware needed): the
# WaveCyclic DSP decisions (nearest-rate mapping and TPDF dither, call/0011), the SP2
# bit-serial protocol (call/0012), and the calibrated chip-write delays (call/0013).
# These run the tests that discharge the corresponding allium obligations.

on:
  push:
    branches: [main]
    paths: ['tests/**', 'wavedsp.h', 'sp2.h', 'chiptiming.h', '.github/workflows/tests.yml']
  pull_request:
    paths: ['tests/**', 'wavedsp.h', 'sp2.h', 'chiptiming.h', '.github/workflows/tests.yml']

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build and run the DSP unit tests
        run: |
          set -e
          for t in tests/*_test.c; do
            echo "== $t =="
            cc -O2 -Wall -Werror -I. -o "/tmp/$(basename "$t" .c)" "$t"
            "/tmp/$(basename "$t" .c)"
          done
